[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgnn-fraud"
version = "0.1.0"
description = "Offline temporal graph fraud detection prototype"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/Home.py" = ["E501"]  # CSS/HTML theme strings contain intentionally long lines
"scripts/generate_ppt_screenshots.py" = ["E501"]  # Matplotlib calls with long string args
