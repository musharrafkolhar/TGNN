seed: 42
data:
  input: data/raw/fixture.csv
  output: data/processed
  source_kind: test_fixture # change to ibm_aml after inspecting the downloaded file
  subset_start: null       # ISO timestamp, inclusive; null uses first timestamp
  subset_end: null         # ISO timestamp, exclusive; null uses all remaining data
  max_events: 200000       # chronological prefix; never splits an equal-timestamp group
  fractions: [0.6, 0.2, 0.2]
runs_dir: runs
baseline:
  n_estimators: 80
  max_depth: 3
  learning_rate: 0.08
tgn:
  epochs: 3
  memory_dim: 32
  time_dim: 16
  embedding_dim: 32
  heads: 2
  neighbor_size: 10
  hidden_dim: 64
  learning_rate: 0.001
  device: cpu
  max_events_per_chunk: 256
explain:
  top_k: 40
  window_seconds: 21600
  hops: 2
  max_edges: 100
  max_cycle_length: 6
  fanout_min_neighbors: 3
  max_motifs: 10
